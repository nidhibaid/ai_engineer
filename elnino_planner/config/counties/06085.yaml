# Santa Clara County pack. Source of truth: docs/scope/02_mvp_spec.md section 5.
county_fips: "06085"
name: Santa Clara County
boundary_file: null            # GeoJSON from Census TIGER: obtain in WP-1
cities: []                     # city boundaries: obtain in WP-1
tide_stations:
  - {id: "9414523", name: Redwood City, role: primary}
  - {id: "9414290", name: San Francisco, role: flood_threshold_reference}
