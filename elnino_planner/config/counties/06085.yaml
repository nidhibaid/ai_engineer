  - {name: Cooling and warming centers, url: "https://oem.santaclaracounty.gov/locations", verified: true, verified_on: "2026-11-25"}
  - {name: Report creek blockages and local flooding, url: "https://www.valleywater.org/flooding-safety/flood-ready/report-creek-blockages-local-flooding", verified: true, verified_on: "2026-11-25"}
  - {name: Check hazards at an address (Cal OES MyHazards), url: "https://myhazards.caloes.ca.gov/", verified: true, verified_on: "2026-11-25"}
  - {name: PG&E outage map, url: "https://pgealerts.alerts.pge.com/outagecenter/", verified: false}
  - {name: NWS San Francisco Bay Area forecasts and alerts, url: "https://www.weather.gov/mtr/", verified: true, verified_on: "2026-11-25"}
corpus_manifest: rag_ingestion/sources.jsonl
