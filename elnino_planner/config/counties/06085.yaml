  name: AlertSCC
  url: https://oem.santaclaracounty.gov/sign-up-for-alerts
  verified: true
  verified_on: "2026-11-25"
contacts:                       # from rag_ingestion/emergency_helplines.txt; confirm before launch
  - {name: Emergency (911), phone: "911", verified: true}
  - {name: County Office of Emergency Management, phone: "(408) 808-7800", url: "https://oem.santaclaracounty.gov/", verified: true, verified_on: "2026-11-25"}
  - {name: Valley Water Watershed Hotline (creek blockages), phone: "(408) 630-2378", url: "https://www.valleywater.org/flooding-safety/flood-ready/report-creek-blockages-local-flooding", verified: true, verified_on: "2026-11-25"}
  - {name: 211 Bay Area, phone: "211", verified: false}
  - {name: PG&E outages and safety, phone: "(800) 743-5000", verified: false}
flood_zone_lookup_url: https://www.valleywater.org/floodzone
